<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Операция: Разблокировка сердца</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #ff2a5f, #d60036);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.5), 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 10;
        }

        .btn:hover {
            background: linear-gradient(135deg, #ff4d79, #f01449);
            box-shadow: 0 0 35px rgba(255, 42, 95, 0.8), 0 6px 20px rgba(0, 0, 0, 0.5);
            transform: translateX(-50%) translateY(-2px);
        }

        #startBtn {
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #startBtn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -40%) scale(0.9);
        }

        #nextBtn {
            top: 30px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(-20px);
            font-size: 1rem;
            padding: 12px 28px;
            background: linear-gradient(135deg, #ff5e7e, #ff2a5f);
        }

        #nextBtn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <button id="nextBtn" class="btn">Далее ✨</button>

        // Типизированные массивы для быстрой работы без лагов
        const x = new Float32Array(PARTICLE_COUNT);
        const y = new Float32Array(PARTICLE_COUNT);
        const tx = new Float32Array(PARTICLE_COUNT);
        const ty = new Float32Array(PARTICLE_COUNT);
        
        const red = new Uint8Array(PARTICLE_COUNT);
        const green = new Uint8Array(PARTICLE_COUNT);
        const blue = new Uint8Array(PARTICLE_COUNT);

        function loadPresetImage() {
            return new Promise((resolve) => {
                if (!PRESET_PHOTO_BASE64 || PRESET_PHOTO_BASE64.trim() === "") {
                    resolve(null);
                    return;
                }
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = PRESET_PHOTO_BASE64;
            });
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        function initParticlesCenter() {
            const cx = width / 2;
            const cy = height / 2;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                x[i] = cx;
                y[i] = cy;
            }
        }

        // Вспомогательная функция перевода HSL в RGB для красивого огненного сердца
        function hslToRgb(h, s, l) {
            s /= 100; l /= 100;
            let c = (1 - Math.abs(2 * l - 1)) * s,
                x = c * (1 - Math.abs((h / 60) % 2 - 1)),
                m = l - c/2,
                r = 0, g = 0, b = 0;
            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
            return {
                r: Math.round((r + m) * 255),
                g: Math.round((g + m) * 255),
                b: Math.round((b + m) * 255)
            };
        }

        // Настройка позиций и ярких огненных цветов для Сердца и Текста
        function setupHeartTargets() {
            const centerX = width / 2;
            const centerY = height / 2;
            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            offscreen.width = width;
            offscreen.height = height;

            offCtx.font = `bold 28px system-ui, -apple-system, sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = '#ffffff';
            offCtx.fillText("Солнышко, прости меня", centerX, centerY + 15);

            const imgData = offCtx.getImageData(0, 0, width, height);
            const textPixels = [];
            for (let py = 0; py < height; py += 2) {
                for (let px = 0; px < width; px += 2) {
                    if (imgData.data[(py * width + px) * 4 + 3] > 128) {
                        textPixels.push({ x: px, y: py });
                    }
                }
            }

            const heartCount = Math.floor(PARTICLE_COUNT * 0.4);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < heartCount) {
                    const t = Math.PI * 2 * (i / heartCount);
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    tx[i] = centerX + hx * 22;
                    ty[i] = centerY + hy * 22;
                } else {
                    if (textPixels.length > 0) {
                        const p = textPixels[Math.floor(Math.random() * textPixels.length)];
                        tx[i] = p.x + (Math.random() - 0.5);
                        ty[i] = p.y + (Math.random() - 0.5);
                    } else {
                        tx[i] = centerX;
                        ty[i] = centerY;
                    }
                }

                // Роскошная палитра огня: от глубокого красного до оранжевого и золотого
                const hue = Math.random() * 50 - 5; // от -5 до 45 (красный, алый, оранжевый, золото)
                const lightness = 45 + Math.random() * 40;
                const rgb = hslToRgb(hue < 0 ? hue + 360 : hue, 100, lightness);
                
                red[i] = rgb.r;
                green[i] = rgb.g;
                blue[i] = rgb.b;
            }
        }

        // Настройка позиций и цветов для полноэкранной фотографии
        function setupPhotoTargets(img) {
            const centerX = width / 2;
            const centerY = height / 2;
            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            offscreen.width = width;
            offscreen.height = height;

            offCtx.fillStyle = '#000000';
            offCtx.fillRect(0, 0, width, height);

            if (img) {
                const aspect = img.width / img.height;
                let dh = height * 0.96;
                let dw = dh * aspect;

                if (dw > width * 0.96) {
                    dw = width * 0.96;
                    dh = dw / aspect;
                }
                offCtx.drawImage(img, centerX - dw / 2, centerY - dh / 2, dw, dh);
            } else {
                offCtx.fillStyle = '#ffffff';
                offCtx.beginPath();
                offCtx.arc(centerX, centerY - height * 0.1, height * 0.15, 0, Math.PI * 2);
                offCtx.fill();
                offCtx.beginPath();
                offCtx.arc(centerX, centerY + height * 0.35, height * 0.3, Math.PI, Math.PI * 2);
                offCtx.fill();
            }

            const imgData = offCtx.getImageData(0, 0, width, height);
            const validPixels = [];

            for (let py = 0; py < height; py += 1) {
                for (let px = 0; px < width; px += 1) {
                    const idx = (py * width + px) * 4;
                    const r = imgData.data[idx];
                    const g = imgData.data[idx + 1];
                    const b = imgData.data[idx + 2];
                    const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                    if (brightness > 15) {
                        const weight = Math.ceil(Math.pow(brightness / 255, 1.2) * 4);
                        for (let w = 0; w < weight; w++) {
                            validPixels.push({ x: px, y: py, r, g, b });
                        }
                    }
                }
            }

            if (validPixels.length === 0) return;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = validPixels[Math.floor(Math.random() * validPixels.length)];
                tx[i] = p.x + (Math.random() - 0.5) * 0.6;
                ty[i] = p.y + (Math.random() - 0.5) * 0.6;

                red[i] = p.r;
                green[i] = p.g;
                blue[i] = p.b;
            }
        }

        async function init() {
            presetImage = await loadPresetImage();
            initParticlesCenter();
        }
        init();

        function animate() {
            // Плавный шлейф
            ctx.fillStyle = 'rgba(5, 5, 8, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Отрисовка всех точек без лагов
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                x[i] += (tx[i] - x[i]) * ASSEMBLE_SPEED;
                y[i] += (ty[i] - y[i]) * ASSEMBLE_SPEED;

                ctx.fillStyle = `rgb(${red[i]}, ${green[i]}, ${blue[i]})`;
                ctx.fillRect(x[i], y[i], 1, 1);
            }

            requestAnimationFrame(animate);
        }
        animate();

        startBtn.addEventListener('click', () => {
            startBtn.classList.add('hidden');
            currentState = 'HEART';

            setupHeartTargets();

            setTimeout(() => {
                if (currentState === 'HEART') {
                    currentState = 'WAITING';
                    nextBtn.classList.add('visible');
                }
            }, 3000);
        });

        nextBtn.addEventListener('click', () => {
            nextBtn.classList.remove('visible');
            currentState = 'PHOTO';

            setupPhotoTargets(presetImage);
        });
    </script>
</body>
</html>
