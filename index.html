<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050508">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Для Солнышка</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#050508">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #ff2a5f, #d60036);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.5), 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 10;
            white-space: nowrap;
        }

        .btn:active {
            transform: translateX(-50%) scale(0.96);
        }

        #startBtn {
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #startBtn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -40%) scale(0.9);
        }

        #nextBtn {
            top: 20px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(-20px);
            font-size: 0.95rem;
            padding: 10px 24px;
            background: linear-gradient(135deg, #ff5e7e, #ff2a5f);
        }

        #nextBtn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

        // Массивы данных
        const x = new Float32Array(MAX_PARTICLES);
        const y = new Float32Array(MAX_PARTICLES);
        const tx = new Float32Array(MAX_PARTICLES);
        const ty = new Float32Array(MAX_PARTICLES);
        const vx = new Float32Array(MAX_PARTICLES);
        const vy = new Float32Array(MAX_PARTICLES);
        const alpha = new Float32Array(MAX_PARTICLES);
        const fadeDelay = new Float32Array(MAX_PARTICLES);
        
        const red = new Uint8Array(MAX_PARTICLES);
        const green = new Uint8Array(MAX_PARTICLES);
        const blue = new Uint8Array(MAX_PARTICLES);

        function loadPresetImage() {
            return new Promise((resolve) => {
                if (!PRESET_PHOTO_BASE64 || PRESET_PHOTO_BASE64.trim() === "") {
                    resolve(null);
                    return;
                }
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = PRESET_PHOTO_BASE64;
            });
        }

        function initParticlesCenter() {
            const cx = width / 2;
            const cy = height / 2;
            for (let i = 0; i < MAX_PARTICLES; i++) {
                x[i] = cx;
                y[i] = cy;
                tx[i] = cx;
                ty[i] = cy;
                alpha[i] = 0;
                fadeDelay[i] = 0;
            }
        }

        function hslToRgb(h, s, l) {
            s /= 100; l /= 100;
            let c = (1 - Math.abs(2 * l - 1)) * s,
                x = c * (1 - Math.abs((h / 60) % 2 - 1)),
                m = l - c/2,
                r = 0, g = 0, b = 0;
            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
            return {
                r: Math.round((r + m) * 255),
                g: Math.round((g + m) * 255),
                b: Math.round((b + m) * 255)
            };
        }

        // Эффектный многоуровневый взрыв сердца со спиральным разлётом
        function triggerHeartExplosion() {
            const cx = width / 2;
            const cy = height / 2;
            const minDim = Math.min(width, height);

            for (let i = 0; i < HEART_COUNT; i++) {
                x[i] = cx;
                y[i] = cy;
                
                const angle = Math.random() * Math.PI * 2;
                // Нелинейный разброс скорости для объёмного салюта
                const speed = (Math.random() * 0.85 + 0.15) * HEART_EXPLOSION_SPEED * (minDim / 800);
                const spiral = (Math.random() - 0.5) * 1.8; // Лёгкий закручивающий момент
                
                vx[i] = Math.cos(angle + spiral) * speed;
                vy[i] = Math.sin(angle + spiral) * speed;
                alpha[i] = 0.25;
            }
        }

        // Взрыв сердечных частиц перед переходом к фото
        function triggerPhotoTransitionExplosion() {
            const cx = width / 2;
            const cy = height / 2;
            const minDim = Math.min(width, height);

            for (let i = 0; i < HEART_COUNT; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (Math.random() * 0.7 + 0.3) * PHOTO_EXPLOSION_SPEED * (minDim / 800);
                vx[i] = Math.cos(angle) * speed;
                vy[i] = Math.sin(angle) * speed;
            }
        }

        // Огромное сердце
        function setupHeartTargets() {
            const centerX = width / 2;
            const centerY = height / 2;
            const minDim = Math.min(width, height);

            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            offscreen.width = width;
            offscreen.height = height;

            const fontSize = Math.max(22, Math.floor(minDim * 0.045));
            offCtx.font = `bold ${fontSize}px system-ui, -apple-system, sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = '#ffffff';
            offCtx.fillText("Я тебя люблю", centerX, centerY);

            const heartRadius = minDim * 0.42;
            offCtx.beginPath();
            for (let t = 0; t < Math.PI * 2; t += 0.003) {
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                const px = centerX + (hx / 16) * heartRadius;
                const py = (centerY - minDim * 0.03) + (hy / 16) * heartRadius;
                if (t === 0) offCtx.moveTo(px, py);
                else offCtx.lineTo(px, py);
            }
            offCtx.closePath();
            offCtx.lineWidth = 8.0;
            offCtx.strokeStyle = '#ffffff';
            offCtx.stroke();

            const imgData = offCtx.getImageData(0, 0, width, height);
            const targetPixels = [];
            for (let py = 0; py < height; py += 1) {
                for (let px = 0; px < width; px += 1) {
                    if (imgData.data[(py * width + px) * 4 + 3] > 128) {
                        targetPixels.push({ x: px, y: py });
                    }
                }
            }

            for (let i = 0; i < HEART_COUNT; i++) {
                if (targetPixels.length > 0) {
                    const p = targetPixels[Math.floor(Math.random() * targetPixels.length)];
                    tx[i] = p.x + (Math.random() - 0.5) * 0.6;
                    ty[i] = p.y + (Math.random() - 0.5) * 0.6;
                } else {
                    tx[i] = centerX;
                    ty[i] = centerY;
                }

                const hue = Math.random() * 45 - 5;
                const lightness = 45 + Math.random() * 40;
                const rgb = hslToRgb(hue < 0 ? hue + 360 : hue, 100, lightness);
                red[i] = rgb.r;
                green[i] = rgb.g;
                blue[i] = rgb.b;
            }

            for (let i = HEART_COUNT; i < MAX_PARTICLES; i++) {
                alpha[i] = 0;
            }
        }

        // Полноцветное фото с поочередным рандомным появлением фоновых точек
        function setupPhotoTargets(img) {
            const centerX = width / 2;
            const centerY = height / 2;
            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            offscreen.width = width;
            offscreen.height = height;

            offCtx.fillStyle = '#000000';
            offCtx.fillRect(0, 0, width, height);

            if (img) {
                const aspect = img.width / img.height;
                let dh = height * 0.92;
                let dw = dh * aspect;

                if (dw > width * 0.92) {
                    dw = width * 0.92;
                    dh = dw / aspect;
                }
                offCtx.drawImage(img, centerX - dw / 2, centerY - dh / 2, dw, dh);
            } else {
                const minDim = Math.min(width, height);
                offCtx.fillStyle = '#ffffff';
                offCtx.beginPath();
                offCtx.arc(centerX, centerY - minDim * 0.1, minDim * 0.15, 0, Math.PI * 2);
                offCtx.fill();
                offCtx.beginPath();
                offCtx.arc(centerX, centerY + minDim * 0.35, minDim * 0.3, Math.PI, Math.PI * 2);
                offCtx.fill();
            }

            const imgData = offCtx.getImageData(0, 0, width, height);
            const validPixels = [];

            for (let py = 0; py < height; py += 1) {
                for (let px = 0; px < width; px += 1) {
                    const idx = (py * width + px) * 4;
                    const r = imgData.data[idx];
                    const g = imgData.data[idx + 1];
                    const b = imgData.data[idx + 2];
                    const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                    if (brightness > 15) {
                        const weight = Math.ceil(Math.pow(brightness / 255, 1.3) * 5);
                        for (let w = 0; w < weight; w++) {
                            validPixels.push({ x: px, y: py, r, g, b });
                        }
                    }
                }
            }

            if (validPixels.length === 0) return;

            for (let i = 0; i < MAX_PARTICLES; i++) {
                const p = validPixels[Math.floor(Math.random() * validPixels.length)];
                tx[i] = p.x + (Math.random() - 0.5) * 0.8;
                ty[i] = p.y + (Math.random() - 0.5) * 0.8;

                red[i] = p.r;
                green[i] = p.g;
                blue[i] = p.b;

                if (i >= HEART_COUNT) {
                    x[i] = tx[i];
                    y[i] = ty[i];
                    // Поочередное случайное появление фоновых точек
                    fadeDelay[i] = Math.random() * FADE_DELAY_MAX + 10; 
                    alpha[i] = 0;
                }
            }
        }

        async function init() {
            presetImage = await loadPresetImage();
            initParticlesCenter();
        }
        init();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            if (currentState === 'HEART' || currentState === 'WAITING') {
                setupHeartTargets();
            } else if (currentState === 'PHOTO') {
                setupPhotoTargets(presetImage);
            }
        });

        // Главный цикл анимации
        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.15)';
            ctx.fillRect(0, 0, width, height);

            if (currentState !== 'IDLE') {
                let arrivedCount = 0;
                const currentAssembleSpeed = (currentState === 'HEART') ? HEART_ASSEMBLE_SPEED : PHOTO_ASSEMBLE_SPEED;

                // 1. Обработка частиц сердца (и при сборке сердца, и при переходе в фото)
                for (let i = 0; i < HEART_COUNT; i++) {
                    // Затухание физики взрыва
                    x[i] += vx[i];
                    y[i] += vy[i];
                    vx[i] *= 0.91;
                    vy[i] *= 0.91;

                    // Движение к целям с раздельной скоростью
                    x[i] += (tx[i] - x[i]) * currentAssembleSpeed;
                    y[i] += (ty[i] - y[i]) * currentAssembleSpeed;

                    const dist = Math.abs(tx[i] - x[i]) + Math.abs(ty[i] - y[i]);
                    if (currentState === 'HEART' && dist < 3.0) {
                        arrivedCount++;
                    }
                    
                    const targetAlpha = Math.max(0.15, 1 - (dist / 180));
                    alpha[i] += (targetAlpha - alpha[i]) * 0.12;

                    ctx.fillStyle = `rgba(${red[i]}, ${green[i]}, ${blue[i]}, ${Math.min(1, Math.max(0, alpha[i]))})`;
                    ctx.fillRect(x[i], y[i], 1, 1);
                }

                // 2. Статические фоновые точки фотографии с поочередным рандомным появлением
                if (currentState === 'PHOTO') {
                    for (let i = HEART_COUNT; i < MAX_PARTICLES; i++) {
                        if (fadeDelay[i] > 0) {
                            fadeDelay[i]--; // Ожидание своей очереди по таймеру
                        } else {
                            alpha[i] += (0.85 - alpha[i]) * FADE_SPEED; // Плавное загорание по очереди
                        }

                        if (alpha[i] > 0.01) {
                            ctx.fillStyle = `rgba(${red[i]}, ${green[i]}, ${blue[i]}, ${alpha[i]})`;
                            ctx.fillRect(x[i], y[i], 1, 1);
                        }
                    }
                }

                // Появление кнопки «Далее» по окончании сборки сердца
                if (!buttonShown && currentState === 'HEART' && arrivedCount > HEART_COUNT * 0.85) {
                    buttonShown = true;
                    currentState = 'WAITING';
                    nextBtn.classList.add('visible');
                }
            }

            requestAnimationFrame(animate);
        }
        animate();

        startBtn.addEventListener('click', () => {
            startBtn.classList.add('hidden');
            buttonShown = false;
            currentState = 'HEART';

            setupHeartTargets();
            triggerHeartExplosion();
        });

        nextBtn.addEventListener('click', () => {
            nextBtn.classList.remove('visible');
            currentState = 'PHOTO';

            setupPhotoTargets(presetImage);
            triggerPhotoTransitionExplosion(); // Лёгкий разлёт перед сборкой в фото
        });

        // PWA регистрация
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW зарегистрирован!', reg))
                    .catch(err => console.log('Ошибка SW:', err));
            });
        }
    </script>
