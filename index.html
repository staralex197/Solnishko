<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Операция: Разблокировка сердца</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: system-ui, -apple-system, sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #ff2a5f, #d60036);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.5), 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
            white-space: nowrap;
        }

        .btn:active {
            transform: translateX(-50%) scale(0.96);
        }

        #startBtn {
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #startBtn.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -40%) scale(0.9);
        }

        #nextBtn {
            top: 20px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%) translateY(-20px);
            font-size: 0.95rem;
            padding: 10px 24px;
            background: linear-gradient(135deg, #ff5e7e, #ff2a5f);
        }

        #nextBtn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

    <button id="nextBtn" class="btn">Далее ✨</button>

        // Типизированные массивы для максимальной производительности
        const x = new Float32Array(PARTICLE_COUNT);
        const y = new Float32Array(PARTICLE_COUNT);
        const tx = new Float32Array(PARTICLE_COUNT);
        const ty = new Float32Array(PARTICLE_COUNT);
        
        // Массивы для теплых огненных оттенков искр
        const red = new Uint8Array(PARTICLE_COUNT);
        const green = new Uint8Array(PARTICLE_COUNT);
        const blue = new Uint8Array(PARTICLE_COUNT);

        function loadPresetImage() {
            return new Promise((resolve) => {
                if (!PRESET_PHOTO_BASE64 || PRESET_PHOTO_BASE64.trim() === "") {
                    resolve(null);
                    return;
                }
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = PRESET_PHOTO_BASE64;
            });
        }

        // Инициализация точек в самом центре экрана (для взрыва)
        function initParticlesCenter() {
            const cx = width / 2;
            const cy = height / 2;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                x[i] = cx;
                y[i] = cy;
            }
        }

        // Вспомогательная функция HSL -> RGB для красивых теплых искр
        function hslToRgb(h, s, l) {
            s /= 100; l /= 100;
            let c = (1 - Math.abs(2 * l - 1)) * s,
                x = c * (1 - Math.abs((h / 60) % 2 - 1)),
                m = l - c/2,
                r = 0, g = 0, b = 0;
            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }
            return {
                r: Math.round((r + m) * 255),
                g: Math.round((g + m) * 255),
                b: Math.round((b + m) * 255)
            };
        }

        // Генерация сердечка и текста с адаптивным масштабом под экран телефона
        function setupHeartTargets() {
            const centerX = width / 2;
            const centerY = height / 2;
            const minDim = Math.min(width, height);
            const scaleFactor = minDim / 800; // адаптив под разные экраны

            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            offscreen.width = width;
            offscreen.height = height;

            const fontSize = Math.max(18, Math.floor(24 * scaleFactor));
            offCtx.font = `bold ${fontSize}px system-ui, -apple-system, sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = '#ffffff';
            offCtx.fillText("Солнышко, прости меня", centerX, centerY + Math.floor(20 * scaleFactor));

            const imgData = offCtx.getImageData(0, 0, width, height);
            const textPixels = [];
            for (let py = 0; py < height; py += 2) {
                for (let px = 0; px < width; px += 2) {
                    if (imgData.data[(py * width + px) * 4 + 3] > 128) {
                        textPixels.push({ x: px, y: py });
                    }
                }
            }

            const heartCount = Math.floor(PARTICLE_COUNT * 0.4);
            const heartScale = 18 * scaleFactor;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < heartCount) {
                    const t = Math.PI * 2 * (i / heartCount);
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    tx[i] = centerX + hx * heartScale;
                    ty[i] = centerY + hy * heartScale;
                } else {
                    if (textPixels.length > 0) {
                        const p = textPixels[Math.floor(Math.random() * textPixels.length)];
                        tx[i] = p.x + (Math.random() - 0.5);
                        ty[i] = p.y + (Math.random() - 0.5);
                    } else {
                        tx[i] = centerX;
                        ty[i] = centerY;
                    }
                }

                // Теплая огненная палитра для сердца
                const hue = Math.random() * 45 - 5;
                const lightness = 45 + Math.random() * 40;
                const rgb = hslToRgb(hue < 0 ? hue + 360 : hue, 100, lightness);
                red[i] = rgb.r;
                green[i] = rgb.g;
                blue[i] = rgb.b;
            }
        }

        // Генерация целей для фотографии с адаптацией под вертикальный и горизонтальный режим
        function setupPhotoTargets(img) {
            const centerX = width / 2;
            const centerY = height / 2;
            const offscreen = document.createElement('canvas');
            const offCtx = offscreen.getContext('2d');
            offscreen.width = width;
            offscreen.height = height;

            offCtx.fillStyle = '#000000';
            offCtx.fillRect(0, 0, width, height);

            if (img) {
                const aspect = img.width / img.height;
                // Занимает до 92% экрана с сохранением пропорций в любом положении (портрет/ландшафт)
                let dh = height * 0.92;
                let dw = dh * aspect;

                if (dw > width * 0.92) {
                    dw = width * 0.92;
                    dh = dw / aspect;
                }
                offCtx.drawImage(img, centerX - dw / 2, centerY - dh / 2, dw, dh);
            } else {
                const minDim = Math.min(width, height);
                offCtx.fillStyle = '#ffffff';
                offCtx.beginPath();
                offCtx.arc(centerX, centerY - minDim * 0.1, minDim * 0.15, 0, Math.PI * 2);
                offCtx.fill();
                offCtx.beginPath();
                offCtx.arc(centerX, centerY + minDim * 0.35, minDim * 0.3, Math.PI, Math.PI * 2);
                offCtx.fill();
            }

            const imgData = offCtx.getImageData(0, 0, width, height);
            const validPixels = [];

            // Шаг 1 для идеальной точности
            for (let py = 0; py < height; py += 1) {
                for (let px = 0; px < width; px += 1) {
                    const idx = (py * width + px) * 4;
                    const r = imgData.data[idx];
                    const g = imgData.data[idx + 1];
                    const b = imgData.data[idx + 2];
                    const brightness = (r * 0.299 + g * 0.587 + b * 0.114);

                    if (brightness > 20) {
                        const weight = Math.ceil(Math.pow(brightness / 255, 1.4) * 4);
                        for (let w = 0; w < weight; w++) {
                            validPixels.push({ x: px, y: py, brightness });
                        }
                    }
                }
            }

            if (validPixels.length === 0) return;

            // Распределение точек с сохранением мерцающего огненного/золотого стиля («как раньше»)
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = validPixels[Math.floor(Math.random() * validPixels.length)];
                tx[i] = p.x + (Math.random() - 0.5) * 0.8;
                ty[i] = p.y + (Math.random() - 0.5) * 0.8;

                const factor = p.brightness / 255;
                const hue = 5 + factor * 45; // Тёплые золотисто-красные переливы
                const lightness = 30 + factor * 55;
                const rgb = hslToRgb(hue, 100, lightness);

                red[i] = rgb.r;
                green[i] = rgb.g;
                blue[i] = rgb.b;
            }
        }

        async function init() {
            presetImage = await loadPresetImage();
            initParticlesCenter();
        }
        init();

        // Обработка поворота экрана и изменения размеров (мобильные ориентации)
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            // Если пользователь повернул телефон, пересчитываем позиции активной фигуры
            if (currentState === 'HEART' || currentState === 'WAITING') {
                setupHeartTargets();
            } else if (currentState === 'PHOTO') {
                setupPhotoTargets(presetImage);
            }
        });

        // Главный цикл отрисовки 60 FPS
        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 8, 0.28)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                x[i] += (tx[i] - x[i]) * ASSEMBLE_SPEED;
                y[i] += (ty[i] - y[i]) * ASSEMBLE_SPEED;

                ctx.fillStyle = `rgb(${red[i]}, ${green[i]}, ${blue[i]})`;
                ctx.fillRect(x[i], y[i], 1, 1);
            }

            requestAnimationFrame(animate);
        }
        animate();

        // Нажатие на кнопку старта (взрыв из центра в сердце)
        startBtn.addEventListener('click', () => {
            startBtn.classList.add('hidden');
            currentState = 'HEART';

            setupHeartTargets();

            setTimeout(() => {
                if (currentState === 'HEART') {
                    currentState = 'WAITING';
                    nextBtn.classList.add('visible');
                }
            }, 3000);
        });

        // Нажатие на кнопку «Далее» (морфинг в фотографию)
        nextBtn.addEventListener('click', () => {
            nextBtn.classList.remove('visible');
            currentState = 'PHOTO';

            setupPhotoTargets(presetImage);
        });
    </script>
